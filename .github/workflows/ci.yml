name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: home-gh-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install C toolchain (ARC runner image has no cc)
        run: |
          SUDO=""; if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update && $SUDO apt-get install -y build-essential pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Black-box forwarding tests
        run: python3 scripts/integration.py -- "$PWD/target/release/ntfy-pushover-forwarder"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint charts/ntfy-pushover-forwarder
      - name: Build runtime image
        run: docker build -t ntfy-forwarder:test .
      - name: Container smoke test
        run: python3 scripts/container_smoke.py ntfy-forwarder:test
