name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    needs: verify
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    outputs:
      new_version: ${{ steps.tag_action.outputs.new_tag }}
      has_new_tag: ${{ steps.tag_action.outputs.tag != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Bump version and get tag
        id: tag_action
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Update Helm Chart Version
        if: steps.tag_action.outputs.new_tag != ''
        run: |
          # Remove 'v' prefix for Helm versioning
          NEW_VER="${{ steps.tag_action.outputs.new_version }}"
          sed -i "s/^version: .*/version: ${NEW_VER}/" charts/ntfy-pushover-forwarder/Chart.yaml
          
      - name: Commit version bump back to Git
        if: steps.tag_action.outputs.new_tag != ''
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore(release): bump version to ${{ steps.tag_action.outputs.new_tag }} [skip ci]"
          file_pattern: 'charts/ntfy-pushover-forwarder/Chart.yaml'

  publish-docker:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    needs: version
    # If no new version was calculated, we can still build but it's better to only release on changes
    if: needs.version.outputs.new_version != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up Environment
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ needs.version.outputs.new_version }}
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-helm:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    needs: [version, publish-docker]
    if: needs.version.outputs.new_version != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up Environment
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        
      - name: Package and Push Helm Chart (OCI)
        run: |
          cd charts/ntfy-pushover-forwarder
          # The file was updated in the version job, but since that was a separate commit push,
          # and this checkout is fresh, we manually update it again for this build cycle
          # using the version from the 'version' job output.
          NEW_VER="${{ needs.version.outputs.new_version }}"
          sed -i "s/^version: .*/version: ${NEW_VER}/" Chart.yaml
          helm package .
          helm push *.tgz oci://ghcr.io/${{ env.REPO_LOWER }}
