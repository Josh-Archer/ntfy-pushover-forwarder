apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntfy-pushover-forwarder.fullname" . }}
  labels:
    {{- include "ntfy-pushover-forwarder.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Forwarder": {
        "NtfyUrl": "{{ .Values.forwarder.ntfyUrl }}",
        "MinimumPriority": {{ .Values.forwarder.minimumPriority | default 1 }},
        "DeduplicationWindowSeconds": {{ .Values.forwarder.deduplicationWindowSeconds | default 300 }},
        "DeduplicationMaxEntries": {{ .Values.forwarder.deduplicationMaxEntries | default 1024 }},
        "QueueEnabled": {{ and .Values.forwarder.queue.enabled .Values.persistence.enabled | toJson }},
        "QueueMaxBytes": {{ .Values.forwarder.queue.maxBytes | default 8388608 }},
        "QueueMaxEntries": {{ .Values.forwarder.queue.maxEntries | default 10000 }},
        "SendRecoveryAlerts": {{ .Values.forwarder.sendRecoveryAlerts | toJson }},
        "HttpPort": {{ .Values.service.port | default 8080 }},
        "Topics": {{ toJson .Values.forwarder.topics }},
        "SoundMap": {{ toJson .Values.forwarder.soundMap }},
        "LogoMap": {{ toJson .Values.forwarder.logoMap }}
      }
    }
