apiVersion: v1
kind: Service
metadata:
  name: ntfy-rust-canary-sink
  namespace: monitoring
  labels:
    app: ntfy-rust-canary-sink
    app.kubernetes.io/part-of: ntfy-rust-canary
spec:
  selector:
    app: ntfy-rust-canary-sink
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-rust-canary-sink
  namespace: monitoring
  labels:
    app: ntfy-rust-canary-sink
    app.kubernetes.io/part-of: ntfy-rust-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy-rust-canary-sink
  template:
    metadata:
      labels:
        app: ntfy-rust-canary-sink
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sink
        image: python:3.12-slim-bookworm
        command:
        - python
        - -B
        - /test/sink.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        env:
        - name: NTFY_URL
          value: http://ntfy.monitoring.svc.cluster.local
        - name: TEST_TOPIC
          value: rust-canary-20261016-66ea3c2
        - name: NTFY_TOKEN
          valueFrom:
            secretKeyRef:
              name: ntfy-secret
              key: token
        volumeMounts:
        - name: code
          mountPath: /test
          readOnly: true
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
      volumes:
      - name: code
        configMap:
          name: ntfy-rust-canary-sink
      terminationGracePeriodSeconds: 5
